*{

body{

    display:flex;
    justify-content:center;
    align-items:center;

    min-height:100vh;

}

.container{

    max-width:900px;

    animation:fadeUp .9s ease forwards;

.code{

.subtitle{

.note{

    margin-bottom:50px;
}

.button{

    display:inline-block;

    padding:16px 34px;

    background:#0071e3;

    color:white;

    text-decoration:none;

    border-radius:999px;

    font-size:18px;

    transition:.25s;
}

.button:hover{

    background:#0062c4;
}

.footer{

    margin-top:70px;

    color:#a1a1a6;

    font-size:14px;
}

@keyframes fadeUp{

    from{

        opacity:0;

        transform:translateY(18px);

    }

    to{

        opacity:1;

        transform:translateY(0);

    }
