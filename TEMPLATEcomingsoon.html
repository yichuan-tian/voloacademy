<!DOCTYPE html>

<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>COURSE NAME | Volo Academy</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,
    "SF Pro Display","Helvetica Neue",sans-serif;

    background:#f5f5f7;

    display:flex;
    justify-content:center;
    align-items:center;

    height:100vh;

    text-align:center;
}

.container{
    max-width:800px;
    padding:40px;
}

h1{
    font-size:72px;
    font-weight:700;
    margin-bottom:20px;
    letter-spacing:-2px;
}

.subtitle{
    font-size:24px;
    color:#6e6e73;
    margin-bottom:40px;
}

.message{
    font-size:18px;
    line-height:1.8;
    color:#6e6e73;
    margin-bottom:50px;
}

.button{
    display:inline-block;
    padding:14px 28px;

    background:#0071e3;
    color:white;

    text-decoration:none;

    border-radius:999px;

    transition:.3s;
}

.button:hover{
    background:#0062c4;
}

.fade{
    animation:fadeUp 1s ease forwards;
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

</style>

</head>

<body>

<div class="container fade">

<h1>COURSE NAME</h1>

<p class="subtitle">
Coming Soon
</p>

<p class="message">
Volo Academy is currently developing this course.
Curated resources, video lessons, notes, and practice materials
will be added in a future update.
</p>

<a href="index.html" class="button">
Return Home
</a>

</div>

</body>

</html>
